{% extends "base.html" %}
{% block title %}Login · FirstGig{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card-fg p-4">
      <h1 class="h4 page-title">Sign in</h1>
      <p class="text-muted small">Demo password for seeded accounts: <code>password123</code></p>
      <form method="post">
        <label class="form-label">Email</label>
        <input class="form-control mb-3" type="email" name="email" required>
        <label class="form-label">Password</label>
        <input class="form-control mb-3" type="password" name="password" required>
        <button class="btn btn-teal w-100" type="submit">Login</button>
      </form>
      <hr>
      <p class="mb-1"><a href="{{ url_for('auth.register_student') }}">Register as student</a></p>
      <p class="mb-0"><a href="{{ url_for('auth.register_client') }}">Register as client</a></p>
      <p class="small text-muted mt-3 mb-0">Admin: admin@firstgig.test · Aarthi: aarthi@college.edu · Client: ananya@novalabs.test</p>
    </div>
  </div>
</div>
{% endblock %}
