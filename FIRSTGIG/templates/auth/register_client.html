{% extends "base.html" %}
{% block title %}Client register · FirstGig{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card-fg p-4">
      <h1 class="h4 page-title">Create a client account</h1>
      <form method="post" class="row g-3">
        <div class="col-12"><label class="form-label">Name</label><input class="form-control" name="name" required></div>
        <div class="col-12"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
        <div class="col-12"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="6" required></div>
        <div class="col-12"><label class="form-label">Business / company name</label><input class="form-control" name="company_name" required></div>
        <div class="col-12"><label class="form-label">Short description</label><textarea class="form-control" name="description" rows="3"></textarea></div>
        <div class="col-12"><button class="btn btn-teal" type="submit">Create client account</button></div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
